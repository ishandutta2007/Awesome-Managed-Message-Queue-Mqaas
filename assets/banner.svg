<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px; }
    
    /* Dynamic Animations */
    .pulse-node { animation: pulse 3s infinite alternate ease-in-out; }
    .dash-line { stroke-dasharray: 8 8; animation: dash 20s linear infinite; }
    .float-item { animation: float 4s infinite ease-in-out alternate; }
    
    @keyframes dash {
      to { stroke-dashoffset: -320; }
    }
    @keyframes pulse {
      0% { r: 6px; opacity: 0.6; }
      100% { r: 10px; opacity: 1; filter: drop-shadow(0 0 8px #c084fc); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- Background Dynamic Network Graphic (Right aligned so it doesn't obscure text) -->
  <g opacity="0.35">
    <path class="dash-line" d="M 750 220 Q 880 100 1020 220 T 1150 120" fill="none" stroke="url(#accent-grad)" stroke-width="2"/>
    <path class="dash-line" d="M 800 80 Q 950 250 1100 100" fill="none" stroke="#818cf8" stroke-width="1.5"/>

    <!-- Animated Nodes -->
    <circle cx="750" cy="220" r="6" fill="#818cf8" class="pulse-node"/>
    <circle cx="880" cy="120" r="8" fill="#c084fc" class="pulse-node" style="animation-delay: 0.5s;"/>
    <circle cx="1020" cy="220" r="7" fill="#f472b6" class="pulse-node" style="animation-delay: 1s;"/>
    <circle cx="1150" cy="120" r="6" fill="#38bdf8" class="pulse-node" style="animation-delay: 1.5s;"/>
  </g>

  <!-- Foreground Title and Subtitle Content -->
  <g transform="translate(60, 0)">
    <!-- Category Tag -->
    <text x="0" y="85" class="tag">⚡ Curated Ecosystem Directory</text>

    <!-- Main Title -->
    <text x="0" y="140" class="title">Awesome Managed Message Queue (MQaaS)</text>

    <!-- Subtitle -->
    <text x="0" y="182" class="subtitle">Cloud Message Brokers, Task Queues &amp; Distributed Event Streaming Platforms</text>

    <!-- Metric Pill 1 -->
    <g transform="translate(0, 220)" class="float-item">
      <rect width="180" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="90" y="24" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">☁️ Commercial SaaS</text>
    </g>

    <!-- Metric Pill 2 -->
    <g transform="translate(195, 220)" class="float-item" style="animation-delay: 0.4s;">
      <rect width="210" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="105" y="24" fill="#bae6fd" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🔥 Open-Source Queues</text>
    </g>

    <!-- Metric Pill 3 -->
    <g transform="translate(420, 220)" class="float-item" style="animation-delay: 0.8s;">
      <rect width="190" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="95" y="24" fill="#fef08a" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">📊 Market &amp; Star Metrics</text>
    </g>
  </g>

  <!-- Decorative Border Accent -->
  <rect x="0" y="314" width="1200" height="6" fill="url(#accent-grad)"/>
</svg>
